name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-deploy. Useful when the page content didn't change but
  # a downstream asset did (e.g. the desktop installer at
  # ``desktop/latest/Duri-latest-*`` got refreshed by a separate pipeline
  # and we want to invalidate any browser caches).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      # WEB_TEST: pull the desktop app's web bundle (built by the
      # ``Publish Web Bundle`` workflow in duri-ai/fe-desktop) and
      # extract into dist/app/ so GitHub Pages serves it under
      # https://duri-ai.com/app/. Public S3 URL — no auth needed.
      # Cleanup: delete this step (see duri_desktop_app/src/web/README.md).
      - name: Fetch web bundle (Shopify-review temp surface)
        run: |
          set -euo pipefail
          mkdir -p dist/app
          curl --fail --silent --show-error --location \
            https://releases.duri-ai.com/app/latest.tar.gz \
            --output /tmp/web-bundle.tar.gz
          tar -xzf /tmp/web-bundle.tar.gz -C dist/app
          ls -la dist/app | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
