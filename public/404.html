<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Duri</title>
    <script>
      // SPA redirect for GitHub Pages — redirects all 404s to index.html with the path preserved
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace(
        window.location.origin +
          "/?p=" +
          encodeURIComponent(path + search) +
          hash,
      );
    </script>
  </head>
  <body></body>
</html>
